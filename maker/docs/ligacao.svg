<g fill="#111" text-anchor="middle">
<text x="480" y="85" font-weight="bold">ESP32 DevKit</text>
<text x="480" y="125" font-size="11">GPIO25 ENA · GPIO26 IN1 · GPIO27 IN2</text>
<text x="480" y="145" font-size="11">GPIO13 ENB · GPIO32 IN3 · GPIO33 IN4</text>
<text x="480" y="175" font-size="11">GPIO5 TRIG · GPIO18 ECHO (com divisor)</text>
<text x="480" y="205" font-size="11">GPIO34 LDR (ADC1)</text>
<text x="480" y="235" font-size="11">GPIO23 buzzer · GPIO2 LED</text>
<text x="480" y="275" font-size="11">VIN = 5 V do L298N · GND comum</text>
<text x="480" y="330" font-size="11" fill="#555">Wi-Fi: envia ao MVP (HTTPS, X-Token)</text>
<text x="480" y="350" font-size="11" fill="#555">TinyML: classifica luz + distância</text>
<text x="140" y="85" font-weight="bold">Ponte H L298N</text>
<text x="140" y="110" font-size="11">ENA/IN1/IN2 → motor esquerdo</text><text x="140" y="128" font-size="11">ENB/IN3/IN4 → motor direito</text>
<text x="140" y="150" font-size="11">12V ← bateria · saída 5V → ESP32</text><text x="140" y="170" font-size="11">GND comum com o ESP32</text>
<text x="105" y="285" font-weight="bold">Motores TT</text><text x="105" y="303" font-size="11">2 rodas (esq. e dir.)</text>
<text x="285" y="285" font-weight="bold">Bateria</text><text x="285" y="303" font-size="10">6 a 9 V</text>
<text x="842" y="85" font-weight="bold">HC-SR04 (distância)</text><text x="842" y="105" font-size="11">VCC 5 V · GND · TRIG → GPIO5</text><text x="842" y="123" font-size="11">ECHO → divisor 1k/2k → GPIO18</text>
<text x="842" y="215" font-weight="bold">LDR (luminosidade) — sensor novo</text><text x="842" y="235" font-size="11">3,3 V — LDR — GPIO34 — 10 kΩ — GND</text><text x="842" y="253" font-size="11">mais luz = valor maior (0 a 4095)</text>
<text x="842" y="355" font-weight="bold">Buzzer ativo</text><text x="842" y="375" font-size="11">GPIO23 → buzzer → GND</text>
<text x="320" y="445" font-weight="bold">Divisor do ECHO</text><text x="320" y="463" font-size="11">1 kΩ e 2 kΩ: 5 V → 3,3 V</text>

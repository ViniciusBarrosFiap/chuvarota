<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs>
<rect x="340" y="40" width="220" height="560" rx="14" fill="#e8f1e8" stroke="#2f6f2f" stroke-width="2"/>
<rect x="395" y="40" width="110" height="60" fill="#c9d8c9" stroke="#2f6f2f"/><text x="450" y="75" text-anchor="middle" font-size="12" fill="#2f6f2f">antena</text>
<rect x="415" y="570" width="70" height="30" rx="4" fill="#bbb" stroke="#555"/><text x="450" y="590" text-anchor="middle" font-size="11">USB</text>
<text x="450" y="330" text-anchor="middle" font-weight="bold" font-size="15">ESP32 DevKit</text>
<text x="450" y="352" text-anchor="middle" font-size="11" fill="#555">vista de cima, USB embaixo</text>
<g font-size="12">
<g text-anchor="end">
<text x="325" y="125" fill="#888">EN</text><text x="325" y="150" fill="#888">VP (36)</text><text x="325" y="175" fill="#888">VN (39)</text>
<text x="325" y="200" font-weight="bold" fill="#0a58ca">D34 ← LDR</text><text x="325" y="225" fill="#888">D35</text>
<text x="325" y="250" font-weight="bold" fill="#0a58ca">D32 ← L298N IN3</text><text x="325" y="275" font-weight="bold" fill="#0a58ca">D33 ← L298N IN4</text>
<text x="325" y="300" font-weight="bold" fill="#0a58ca">D25 ← L298N ENA</text><text x="325" y="325" font-weight="bold" fill="#0a58ca">D26 ← L298N IN1</text>
<text x="325" y="350" font-weight="bold" fill="#0a58ca">D27 ← L298N IN2</text><text x="325" y="375" fill="#888">D14</text><text x="325" y="400" fill="#888">D12 (não usar)</text>
<text x="325" y="425" font-weight="bold" fill="#0a58ca">D13 ← L298N ENB</text>
<text x="325" y="450" font-weight="bold" fill="#111">GND ← trilho GND</text><text x="325" y="475" font-weight="bold" fill="#b00020">VIN ← trilho 5 V</text>
</g>
<g text-anchor="start">
<text x="575" y="125" font-weight="bold" fill="#0a58ca">D23 → buzzer (+)</text><text x="575" y="150" fill="#888">D22</text><text x="575" y="175" fill="#888">TX0</text><text x="575" y="200" fill="#888">RX0</text>
<text x="575" y="225" fill="#888">D21</text><text x="575" y="250" fill="#888">D19</text>
<text x="575" y="275" font-weight="bold" fill="#0a58ca">D18 ← ECHO (pelo divisor)</text><text x="575" y="300" font-weight="bold" fill="#0a58ca">D5 → TRIG do HC-SR04</text>
<text x="575" y="325" fill="#888">TX2</text><text x="575" y="350" fill="#888">RX2</text><text x="575" y="375" fill="#888">D4</text>
<text x="575" y="400" fill="#888">D2 (LED da placa)</text><text x="575" y="425" fill="#888">D15</text>
<text x="575" y="450" font-weight="bold" fill="#111">GND (segundo GND)</text><text x="575" y="475" font-weight="bold" fill="#0a58ca">3V3 → LDR</text>
</g></g>
<text x="450" y="620" text-anchor="middle" font-size="12" fill="#555">Em azul: pinos que usamos. Confira os nomes impressos na sua placa (D25, D26...). A posição pode variar entre modelos.</text>
</svg>

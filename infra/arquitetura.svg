<text x="162" y="145" font-weight="bold">Pipeline GitHub Actions</text>
<text x="162" y="170" font-size="11">1. Gitleaks (segredos)</text><text x="162" y="188" font-size="11">2. Semgrep (código)</text><text x="162" y="206" font-size="11">3. testes (pytest)</text>

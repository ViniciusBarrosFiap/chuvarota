name: rpa-alertas
on:
  schedule: [{cron: "0 */3 * * *"}]
  workflow_dispatch:
permissions: {contents: write, actions: write}
jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests && python rpa/src/rpa.py
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          git config user.name rpa-bot && git config user.email rpa-bot@users.noreply.github.com
          git add mvp/data/alertas.json rpa/logs/rpa.log
          git commit -m "chore: atualiza alertas" || echo "sem mudancas"
          git push
          # o push do bot não dispara outros workflows; chamo o deploy para o MVP publicar os alertas novos
          gh workflow run devsecops.yml --ref main

name: devsecops

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install semgrep
      - run: semgrep scan --config p/python --config p/dockerfile --metrics=off --error mvp/app.py rpa/src Dockerfile

  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests pytest httpx -r mvp/requirements.txt
      - run: pytest rpa mvp

  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t chuvarota-mvp:ci .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: chuvarota-mvp:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: "1"

  publicar:
    needs: [gitleaks, semgrep, testes, imagem, terraform]
    # publica na main ou quando alguém dispara o workflow à mão
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      imagem: ${{ steps.dados.outputs.imagem }}
    steps:
      - uses: actions/checkout@v4
      - id: dados
        run: echo "imagem=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/chuvarota-mvp:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker build -t "${{ steps.dados.outputs.imagem }}" .
          docker push "${{ steps.dados.outputs.imagem }}"

  deploy:
    needs: publicar
    # só depois que a nuvem existe (a variável é criada pelo configurar_github.sh)
    if: vars.APP_NAME != ''
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Atualizar o MVP
        run: |
          az webapp config container set --name ${{ vars.APP_NAME }} --resource-group ${{ vars.RESOURCE_GROUP }} \
            --container-image-name "${{ needs.publicar.outputs.imagem }}" --container-registry-url https://ghcr.io
          az webapp restart --name ${{ vars.APP_NAME }} --resource-group ${{ vars.RESOURCE_GROUP }}
      - name: Teste de fumaça
        run: |
          for i in $(seq 1 30); do curl -fsS "https://${{ vars.APP_NAME }}.azurewebsites.net/health" && exit 0; sleep 10; done
          exit 1

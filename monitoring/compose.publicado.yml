# monitora o MVP publicado no Azure: docker compose -f monitoring/compose.publicado.yml up -d
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus.publicado.yml:/etc/prometheus/prometheus.yml:ro
      - ./alertas.yml:/etc/prometheus/alertas.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-troque-esta-senha}
    volumes:
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana/chuvarota.json:/var/lib/grafana/dashboards/chuvarota.json:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

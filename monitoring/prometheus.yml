global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: mvp
    # no compose o alvo é o container; para monitorar o MVP publicado, troque por <url>:443 com scheme https
    metrics_path: /metrics
    static_configs:
      - targets: ["mvp:8000"]

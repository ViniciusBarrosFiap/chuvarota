groups:
  - name: chuvarota
    rules:
      - alert: MVPForaDoAr
        expr: up{job="mvp"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "O MVP não responde ao Prometheus"}

      - alert: TaxaDeErrosAlta
        expr: sum(rate(http_requests_total{status=~"4..|5.."}[1m])) / sum(rate(http_requests_total[1m])) > 0.10
        for: 30s
        labels: {severity: warning}
        annotations: {summary: "Mais de 10% dos pedidos terminaram em erro"}

      - alert: LatenciaAlta
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[1m]))) > 0.5
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "p95 da latência acima de 500 ms"}
